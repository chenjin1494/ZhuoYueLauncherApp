<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17272A"/>
      <stop offset="0.58" stop-color="#0D1719"/>
      <stop offset="1" stop-color="#081012"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#74E0C2"/><stop offset="1" stop-color="#42C8A5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="214" fill="url(#base)" filter="url(#shadow)"/>
  <rect x="68" y="68" width="888" height="888" rx="210" fill="none" stroke="#4A6265" stroke-width="8" opacity="0.78"/>
  <circle cx="512" cy="512" r="292" fill="#122124" stroke="#294043" stroke-width="10"/>

  <!-- one input -->
